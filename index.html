<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Your voucher | AI Interview Analyzer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><img src="logo.svg" width="280" height="42" alt="AI Interview Analyzer"></header>
  <main>
    <section class="card" aria-labelledby="heading">
      <div class="gift" aria-hidden="true">✦</div>
      <h1 id="heading">Congratulations! 🎉</h1>
      <p class="subtitle" id="subtitle">You've won an exclusive voucher!</p>
      <div id="voucher" hidden>
        <p class="value" id="value"></p>
        <p class="label">Your exclusive voucher</p>
        <code id="code" tabindex="0" aria-label="Your unique voucher code"></code>
        <button id="copy" type="button">Copy voucher code</button>
        <p id="status" role="status" aria-live="polite"></p>
        <p class="save">Save your code to redeem your reward.</p>
      </div>
      <noscript><p>Please enable JavaScript to display your voucher.</p></noscript>
    </section>
  </main>
  <footer>AI Interview Analyzer<br>Better interviews. More human connections.</footer>
</body>
</html>
